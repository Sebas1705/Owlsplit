name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (detekt, tests, assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew detekt testDebugUnitTest verifySqlDelightMigration :composeApp:assembleDebug --continue
      - run: ./gradlew recordRoborazziDebug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-screenshots
          path: |
            core/ui/screenshots/
            feature/*/screenshots/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  ios:
    name: iOS app (simulator)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      # The Xcode project is generated from iosApp/project.yml; the build runs the Kotlin
      # framework phase, resolves the Firebase iOS SDK (SPM) and links the whole app, unsigned.
      - run: brew install xcodegen
      - working-directory: iosApp
        run: xcodegen generate
      - working-directory: iosApp
        run: |
          xcodebuild build -project Owlsplit.xcodeproj -scheme Owlsplit -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO -quiet

  firestore-rules:
    name: Firestore rules (emulator) and brand files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/rules-test/package-lock.json
      - run: npm ci --prefix firebase/rules-test
      - working-directory: firebase
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-owlsplit "npm --prefix rules-test test"
      # Icons, web colours and favicon are generated from brand/tokens.json (docs/BRAND.md).
      - name: Brand files up to date
        run: node scripts/brand.mjs --check
