name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (detekt, tests, assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew detekt testDebugUnitTest verifySqlDelightMigration :composeApp:assembleDebug --continue
      # Kover merges the debug unit tests that just ran (they stay up to date) into one report and fails the
      # job if line coverage drops below the threshold in build.gradle.kts (koverVerifyUnitTests).
      - name: Coverage report (Kover)
        run: ./gradlew koverXmlReportUnitTests koverHtmlReportUnitTests koverVerifyUnitTests --continue
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "build/reports/kover/reportUnitTests.xml";
            if (!fs.existsSync(path)) { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Coverage\n\nNo Kover report was produced.\n"); process.exit(0); }
            const xml = fs.readFileSync(path, "utf8");
            const pct = (type) => {
              // The report-level counters are the last ones in the JaCoCo-style XML.
              const all = [...xml.matchAll(new RegExp(`<counter type="${type}" missed="(\\d+)" covered="(\\d+)"`, "g"))];
              const [, missed, covered] = all[all.length - 1].map(Number);
              return { pct: (100 * covered / (covered + missed)).toFixed(1), covered, total: covered + missed };
            };
            const line = pct("LINE"), branch = pct("BRANCH");
            const threshold = (fs.readFileSync("build.gradle.kts", "utf8").match(/minBound\((\d+)\)/) || [])[1];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Coverage (Kover, debug unit tests)\n\n` +
              `| Metric | Covered | Coverage |\n|---|---|---|\n` +
              `| Lines | ${line.covered} / ${line.total} | **${line.pct} %** |\n` +
              `| Branches | ${branch.covered} / ${branch.total} | ${branch.pct} % |\n\n` +
              `Minimum line coverage enforced by koverVerifyUnitTests: ${threshold} %. HTML report in the kover-html-report artifact.\n`);
          '
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: kover-html-report
          path: build/reports/kover/htmlUnitTests/
      - run: ./gradlew recordRoborazziDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: |
            core/ui/screenshots/
            feature/*/screenshots/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  ios:
    name: iOS app (simulator)
    # Paused for now: only a manual run (Actions, CI, Run workflow) builds the iOS app.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      # The Xcode project is generated from iosApp/project.yml; the build runs the Kotlin
      # framework phase, resolves the Firebase iOS SDK (SPM) and links the whole app, unsigned.
      - run: brew install xcodegen
      - working-directory: iosApp
        run: xcodegen generate
      - working-directory: iosApp
        run: |
          xcodebuild build -project Owlsplit.xcodeproj -scheme Owlsplit -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO -quiet

  firestore-rules:
    name: Firestore rules (emulator) and brand files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/rules-test/package-lock.json
      - run: npm ci --prefix firebase/rules-test
      - working-directory: firebase
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-owlsplit "npm --prefix rules-test test"
      # Icons, web colours and favicon are generated from brand/tokens.json (docs/BRAND.md).
      - name: Brand files up to date
        run: node scripts/brand.mjs --check
      # Hand-written release notes (fastlane/release-notes) and the store listing within Play's limits.
      - name: Release notes and Play listing within limits
        run: node scripts/release-notes.mjs --check
