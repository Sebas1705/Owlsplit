name: Deploy Firebase (production)

# What `main` says about the backend is what production runs: Firestore rules and indexes and the
# Hosting site (download page, invite pages, assetlinks.json). The rules are tested on every PR
# (ci.yml) before they get here. Credentials: FIREBASE_SERVICE_ACCOUNT_JSON (owlsplit-ci, least
# roles) from Doppler owlsplit/prd. There is one project: this is its only deploy path besides a
# manual `firebase deploy`.
#
# The download page links the APK of the latest release (pre-releases included), which stays in
# the public GitHub Release (Spark forbids executables on Hosting): /download/latest.json describes
# it and /apk redirects to it. Every deploy rewrites both, and a finished Release run deploys again.
on:
  push:
    branches: [main]
    paths: ["firebase/firebase.json", "firebase/firestore.rules", "firebase/firestore.indexes.json", "firebase/hosting/**"]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    # After a release only when it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history and tags: a release's versionCode is the commit count of its tag (build-release).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dopplerhq/cli-action@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      # The Spark plan forbids executables on Hosting: the APK stays in the (public) GitHub Release;
      # the site only describes it (/download/latest.json) and redirects /apk to it.
      - name: Latest release for the download page
        working-directory: firebase
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          [ -n "$TAG" ] || { echo "::notice::No release yet: the download page says so"; exit 0; }
          FILE="Owlsplit-$TAG.apk"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE" --dir "$RUNNER_TEMP"
          DATE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)
          SIZE=$(stat -c %s "$RUNNER_TEMP/$FILE")
          SHA=$(sha256sum "$RUNNER_TEMP/$FILE" | cut -d' ' -f1)
          # The app compares it with its own to offer the update (docs/plans/2026-10-12-p15-updates.md).
          CODE=$(git rev-list --count "$TAG")
          mkdir -p hosting/download
          jq -n --arg version "${TAG#v}" --arg tag "$TAG" --argjson versionCode "$CODE" --arg file "$FILE" --arg url "$URL" \
            --argjson size "$SIZE" --arg sha256 "$SHA" --arg date "$DATE" \
            '{version: $version, tag: $tag, versionCode: $versionCode, file: $file, url: $url, size: $size, sha256: $sha256, date: $date}' \
            > hosting/download/latest.json
          jq --arg url "$URL" '.hosting.redirects = [{source: "/apk", destination: $url, type: 302}]' \
            firebase.json > "$RUNNER_TEMP/firebase.json" && mv "$RUNNER_TEMP/firebase.json" firebase.json
          cat hosting/download/latest.json
      - name: Deploy rules, indexes and Hosting to owlsplit
        working-directory: firebase
        run: |
          # Until scripts/setup-ci-access.mjs has run there is nothing to deploy with: skip, do not fail.
          [ -n "$DOPPLER_TOKEN" ] || { echo "::warning::No DOPPLER_TOKEN secret yet: production deploy skipped"; exit 0; }
          doppler run -- bash -c '
            umask 077
            printf "%s" "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx --yes firebase-tools@15.32.1 deploy --only firestore,hosting --project owlsplit --non-interactive'
      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
