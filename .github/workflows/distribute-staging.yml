name: Distribute staging

# Every merge to `main` that changes the app reaches the testers as a staging build: package
# es.sebas1705.owlsplit.stg on the owlsplit-stg Firebase project (installs next to production),
# signed with the release key so each build installs over the previous one. Tagged production
# releases go through release.yml. Secrets: Doppler owlsplit/stg through DOPPLER_TOKEN_STG.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "firebase/**", ".github/workflows/release.yml", ".github/workflows/deploy-firebase.yml"]
  workflow_dispatch:

concurrency:
  group: distribute-staging
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
    steps:
      - uses: actions/checkout@v7

      - name: Check access
        id: access
        run: |
          # Until scripts/setup-ci-access.mjs has run there is nothing to distribute with.
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::warning::No DOPPLER_TOKEN_STG secret yet: staging distribution skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-release
        if: steps.access.outputs.ready == 'true'
        with:
          environment: staging
          version-name: stg-${{ github.run_number }}
          extra-secrets: FIREBASE_SERVICE_ACCOUNT_JSON

      - name: Upload to Firebase App Distribution
        if: steps.access.outputs.ready == 'true'
        env:
          TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}
        run: |
          export NOTES="Staging ${{ github.run_number }}: $(git log -1 --pretty='%s (%h)')"
          doppler run -- bash -c '
            umask 077
            printf "%s" "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx --yes firebase-tools@15.32.1 appdistribution:distribute composeApp/build/outputs/apk/release/composeApp-release.apk \
              --app "$FIREBASE_ANDROID_APP_ID" \
              --groups "$TESTER_GROUP" \
              --release-notes "$NOTES"'

      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json" composeApp/google-services.json
