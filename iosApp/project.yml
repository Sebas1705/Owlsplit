# Xcode project of the iOS app, generated with XcodeGen (`cd iosApp && xcodegen generate`):
# the .xcodeproj is not committed. CI builds it for the simulator without signing
# (.github/workflows/ci.yml). Signing, Apple sign-in and Universal Links need the Apple Developer
# Team ID (docs/plans/2026-10-08-p11c-ios.md).
name: Owlsplit
options:
  bundleIdPrefix: es.sebas1705
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # The version GitLive 2.7.0 is built against (firebase-cocoapods in its catalog).
    exactVersion: 11.8.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # REVERSED_CLIENT_ID of GoogleService-Info.plist once Google is enabled in Firebase; with this
    # placeholder the app hides Google sign-in (GoogleSignIn.swift, isConfigured).
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.pending

targets:
  Owlsplit:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "*.entitlements"
    entitlements:
      path: iosApp/iosApp.entitlements
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Owlsplit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Owlsplit uses the camera to scan invite QR codes.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.sebas1705.owlsplit
        PRODUCT_NAME: Owlsplit
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The shared code (Kotlin/Native static framework built by the phase below).
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, ComposeApp, -lsqlite3]
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
